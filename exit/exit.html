<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>盛岡キャラクター脱出ゲーム - 長編スマホ版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap');
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background: #0f172a;
            touch-action: manipulation;
            user-select: none;
        }
        /* スマホフレーム */
        .smartphone-frame {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            max-height: 880px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        @media (min-height: 900px) {
            .smartphone-frame {
                border-radius: 40px;
                border: 10px solid #334155;
            }
        }
        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-0 sm:p-4">

    <!-- スマホ画面コンテナ -->
    <div class="smartphone-frame bg-gradient-to-b from-slate-900 via-blue-950 to-slate-900 flex flex-col relative overflow-hidden text-slate-100">
        
        <!-- ヘッダー -->
        <header class="px-4 py-3 bg-slate-900/80 backdrop-blur border-b border-slate-800 flex justify-between items-center z-20 shrink-0">
            <div class="flex items-center space-x-2">
                <span class="text-xl">🍜</span>
                <h1 class="text-sm font-black tracking-wider text-amber-400">盛岡めんこい大脱出</h1>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="openNoteModal()" class="px-2.5 py-1 bg-amber-500/20 border border-amber-500/40 text-amber-300 rounded-lg text-xs font-bold active:scale-95 transition">メモ帳</button>
                <button onclick="resetGameData()" class="px-2 py-1 bg-rose-500/20 border border-rose-500/40 text-rose-300 rounded-lg text-xs font-bold active:scale-95 transition">リセット</button>
            </div>
        </header>

        <!-- メイン画面（エリア・謎解きビュー） -->
        <main id="main-view" class="flex-1 relative overflow-hidden flex flex-col">
            <!-- JavaScriptで動的生成 -->
        </main>

        <!-- 下部インベントリ & エリア移動バー -->
        <footer class="bg-slate-900/90 backdrop-blur border-t border-slate-800 p-3 z-20 shrink-0 flex flex-col space-y-2">
            <!-- インベントリ -->
            <div class="flex items-center justify-between">
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">もちもの (<span id="inv-count">0</span>)</span>
                <div id="inventory-slots" class="flex space-x-1.5 overflow-x-auto py-1 max-w-[310px] custom-scroll">
                    <!-- アイテムスロット -->
                </div>
            </div>

            <!-- エリア移動ボタン -->
            <div class="grid grid-cols-4 gap-1.5 pt-1 border-t border-slate-800/80">
                <button onclick="changeArea(0)" id="nav-btn-0" class="py-2 text-xs font-bold rounded-xl bg-slate-800 text-slate-300 active:bg-blue-600 transition flex flex-col items-center">
                    <span>🏮</span>ロビー
                </button>
                <button onclick="changeArea(1)" id="nav-btn-1" class="py-2 text-xs font-bold rounded-xl bg-slate-800 text-slate-300 active:bg-blue-600 transition flex flex-col items-center">
                    <span>🐦</span>キッチン
                </button>
                <button onclick="changeArea(2)" id="nav-btn-2" class="py-2 text-xs font-bold rounded-xl bg-slate-800 text-slate-300 active:bg-blue-600 transition flex flex-col items-center">
                    <span>🐧</span>ラボ
                </button>
                <button onclick="changeArea(3)" id="nav-btn-3" class="py-2 text-xs font-bold rounded-xl bg-slate-800 text-slate-300 active:bg-blue-600 transition flex flex-col items-center">
                    <span>🚪</span>ゴール
                </button>
            </div>
        </footer>

        <!-- トースト通知・メッセージ表示 -->
        <div id="toast-box" class="absolute top-14 left-4 right-4 bg-blue-600 text-white text-xs font-bold px-4 py-2.5 rounded-2xl shadow-2xl transition-all duration-300 transform -translate-y-20 opacity-0 z-40 flex items-center space-x-2 border border-blue-400">
            <span id="toast-icon" class="text-base">✨</span>
            <span id="toast-text" class="flex-1">メッセージがここに入ります</span>
        </div>

        <!-- モーダルウィンドウ -->
        <div id="modal-overlay" class="absolute inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
            <div id="modal-container" class="bg-slate-900 border-2 border-slate-700 rounded-3xl p-5 w-full max-w-sm shadow-2xl flex flex-col max-h-[85vh]">
                <div class="flex justify-between items-center mb-3">
                    <h3 id="modal-title" class="text-base font-extrabold text-amber-400">タイトル</h3>
                    <button onclick="closeModal()" class="w-7 h-7 bg-slate-800 rounded-full text-slate-400 hover:text-white flex items-center justify-center font-bold">×</button>
                </div>
                <div id="modal-desc" class="text-xs text-slate-300 mb-4 leading-relaxed">説明文</div>
                <div id="modal-body" class="flex-1 overflow-y-auto mb-4 custom-scroll space-y-3"></div>
                <div id="modal-footer" class="flex justify-end space-x-2 pt-2 border-t border-slate-800">
                    <button onclick="closeModal()" class="px-4 py-2 bg-slate-800 text-slate-300 font-bold text-xs rounded-xl">とじる</button>
                    <button id="modal-action-btn" class="px-4 py-2 bg-blue-600 text-white font-bold text-xs rounded-xl hidden">決定</button>
                </div>
            </div>
        </div>

        <!-- クリア画面 -->
        <div id="clear-screen" class="absolute inset-0 bg-gradient-to-b from-amber-950 via-slate-950 to-blue-950 hidden flex flex-col items-center justify-center z-50 p-6 text-center">
            <div class="text-6xl mb-3 animate-float">🎉🍜🎉</div>
            <h2 class="text-2xl font-black text-amber-400 mb-2">完全脱出きんねん！</h2>
            <p class="text-xs text-slate-300 leading-relaxed mb-6">
                盛岡冷麺ダルマ、セキレイメン、れいぺん、じゃじゃ丸の4人と力をあわせ、すべての謎を解き明かして盛岡の街へ飛び出した！おめでとう！
            </p>
            <button onclick="resetGameData()" class="px-6 py-3 bg-amber-400 text-slate-950 font-black text-sm rounded-2xl shadow-xl active:scale-95 transition">
                最初からもう一度遊ぶ
            </button>
        </div>

    </div>

    <script>
      /*!
       * Game Title: (ミニゲームのタイトル)
       * Author: むつみん
       * Copyright (c) 2026 むつみん
       */
        // --- ゲーム状態管理 ---
        let currentArea = 0; // 0: ロビー, 1: キッチン, 2: ラボ, 3: ゴール
        let inventory = [];
        let selectedItem = null;
        let flags = {
            darumaCupOpen: false,      // ダルマの器が開いたか
            gotWatermelon: false,      // スイカのパーツ取得
            jajamaruFed: false,        // じゃじゃ丸に肉味噌をあげたか
            gotSpicySauce: false,      // 辛みダレ取得
            sekireiWingSolved: false,  // セキレイメンのパズルクリア
            gotIceKey: false,          // 氷の鍵取得
            labPanelSolved: false,     // ラボの装置クリア
            gotColdElement: false,     // 冷麺の極意取得
            doorUnlocked: false        // 最終ドア開放
        };

        // ローカルストレージからの読み込み
        function loadGame() {
            const saved = localStorage.getItem('morioka_escape_long_save');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    currentArea = data.currentArea;
                    inventory = data.inventory;
                    flags = data.flags;
                } catch(e) { console.error(e); }
            }
        }

        function saveGame() {
            localStorage.setItem('morioka_escape_long_save', JSON.stringify({
                currentArea, inventory, flags
            }));
        }

        function resetGameData() {
            localStorage.removeItem('morioka_escape_long_save');
            location.reload();
        }

        // --- トースト通知 ---
        function showToast(icon, text) {
            const box = document.getElementById('toast-box');
            document.getElementById('toast-icon').textContent = icon;
            document.getElementById('toast-text').textContent = text;
            box.classList.remove('-translate-y-20', 'opacity-0');
            setTimeout(() => {
                box.classList.add('-translate-y-20', 'opacity-0');
            }, 3000);
        }

        // --- エリア切り替え ---
        function changeArea(areaIndex) {
            currentArea = areaIndex;
            // ナビゲーションボタンの色変更
            for(let i=0; i<4; i++) {
                const btn = document.getElementById(`nav-btn-${i}`);
                if(i === currentArea) {
                    btn.className = "py-2 text-xs font-bold rounded-xl bg-blue-600 text-white shadow transition flex flex-col items-center scale-105";
                } else {
                    btn.className = "py-2 text-xs font-bold rounded-xl bg-slate-800 text-slate-300 active:bg-blue-600 transition flex flex-col items-center";
                }
            }
            renderArea();
            saveGame();
        }

        // --- インベントリ関連 ---
        function renderInventory() {
            const container = document.getElementById('inventory-slots');
            document.getElementById('inv-count').textContent = inventory.length;
            container.innerHTML = '';

            if(inventory.length === 0) {
                container.innerHTML = '<span class="text-[11px] text-slate-500 pl-2">アイテムなし</span>';
                return;
            }

            inventory.forEach((item, index) => {
                const div = document.createElement('div');
                const isSelected = selectedItem && selectedItem.id === item.id;
                div.className = `w-10 h-10 rounded-xl bg-slate-800 border-2 ${isSelected ? 'border-amber-400 bg-amber-950/50' : 'border-slate-700'} flex items-center justify-center text-lg cursor-pointer shrink-0 transition active:scale-95 relative`;
                div.innerHTML = item.icon;
                div.title = item.name;
                div.onclick = () => selectItem(item);
                container.appendChild(div);
            });
        }

        function addItem(item) {
            if(!inventory.some(i => i.id === item.id)) {
                inventory.push(item);
                renderInventory();
                showToast(item.icon, `アイテム「${item.name}」を手に入れた！`);
                saveGame();
            }
        }

        function removeItem(id) {
            inventory = inventory.filter(i => i.id !== id);
            if(selectedItem && selectedItem.id === id) selectedItem = null;
            renderInventory();
            saveGame();
        }

        function selectItem(item) {
            if(selectedItem && selectedItem.id === item.id) {
                selectedItem = null;
                showToast('🔍', 'アイテムの選択を解除しました');
            } else {
                selectedItem = item;
                showToast(item.icon, `「${item.name}」を手に持った`);
            }
            renderInventory();
        }

        // --- エリアの描画内容定義 ---
        function renderArea() {
            const view = document.getElementById('main-view');
            
            if(currentArea === 0) {
                // エリア0: ロビー（盛岡冷麺ダルマ & テーブル・メモ）
                view.innerHTML = `
                    <div class="flex-1 p-4 flex flex-col justify-between relative bg-gradient-to-b from-slate-900 to-rose-950/30 overflow-y-auto custom-scroll">
                        <div class="text-center py-2">
                            <span class="text-[10px] font-bold tracking-widest text-rose-400 uppercase">AREA 01</span>
                            <h2 class="text-lg font-black text-slate-100">エントランスロビー</h2>
                        </div>

                        <div class="flex flex-col items-center space-y-6 my-auto py-4">
                            <!-- 盛岡冷麺ダルマ -->
                            <div onclick="interactDaruma()" class="cursor-pointer text-center group relative animate-float">
                                <div class="w-36 h-36 bg-slate-800/90 border-2 border-rose-500/50 rounded-3xl shadow-xl flex flex-col items-center justify-center p-3 relative mx-auto group-hover:border-rose-400 transition">
                                    <div class="text-5xl mb-1">🏮🍜</div>
                                    <span class="text-[11px] font-bold text-rose-300 bg-rose-950/80 px-2 py-0.5 rounded-full border border-rose-800">盛岡冷麺ダルマ</span>
                                    <div class="absolute -top-2 -right-2 bg-rose-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow">${flags.darumaCupOpen ? '開' : '謎'}</div>
                                </div>
                                <p class="text-xs font-bold text-slate-400 mt-2">冷麺の器オブジェ（タップして調べる）</p>
                            </div>

                            <!-- テーブルのメモ -->
                            <div onclick="inspectLobbyNote()" class="cursor-pointer bg-amber-100/10 border border-amber-300/30 p-3 rounded-2xl w-full max-w-xs flex items-center space-x-3 active:scale-95 transition">
                                <span class="text-2xl">📝</span>
                                <div class="text-left">
                                    <p class="text-xs font-bold text-amber-300">古い石碑のメモ</p>
                                    <p class="text-[10px] text-slate-400">「盛岡の石割桜は岩の隙間から……数字のヒントがある」</p>
                                </div>
                            </div>
                        </div>

                        <div class="text-center text-[11px] text-slate-500 py-2">
                            ヒント：ダルマの頭の器をよく観察してみよう
                        </div>
                    </div>
                `;
            } else if(currentArea === 1) {
                // エリア1: キッチン（セキレイメン & じゃじゃ丸）
                view.innerHTML = `
                    <div class="flex-1 p-4 flex flex-col justify-between relative bg-gradient-to-b from-slate-900 to-amber-950/30 overflow-y-auto custom-scroll">
                        <div class="text-center py-2">
                            <span class="text-[10px] font-bold tracking-widest text-amber-400 uppercase">AREA 02</span>
                            <h2 class="text-lg font-black text-slate-100">めんこいキッチン</h2>
                        </div>

                        <div class="grid grid-cols-2 gap-4 my-auto py-2">
                            <!-- セキレイメン -->
                            <div onclick="interactSekireimen()" class="cursor-pointer text-center group">
                                <div class="w-full h-36 bg-slate-800/90 border-2 border-cyan-500/50 rounded-3xl shadow-xl flex flex-col items-center justify-center p-3 relative group-hover:border-cyan-400 transition">
                                    <div class="text-4xl mb-1">🐦🍜</div>
                                    <span class="text-[11px] font-bold text-cyan-300 bg-cyan-950/80 px-2 py-0.5 rounded-full border border-cyan-800">セキレイメン</span>
                                    <div class="absolute -top-2 -right-2 bg-cyan-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow">${flags.sekireiWingSolved ? '済' : 'パズル'}</div>
                                </div>
                                <p class="text-xs font-bold text-slate-400 mt-2">鳥の丼マスコット</p>
                            </div>

                            <!-- じゃじゃ丸 -->
                            <div onclick="interactJajamaru()" class="cursor-pointer text-center group">
                                <div class="w-full h-36 bg-slate-800/90 border-2 border-amber-500/50 rounded-3xl shadow-xl flex flex-col items-center justify-center p-3 relative group-hover:border-amber-400 transition">
                                    <div class="text-4xl mb-1">🐾🍝</div>
                                    <span class="text-[11px] font-bold text-amber-300 bg-amber-950/80 px-2 py-0.5 rounded-full border border-amber-800">じゃじゃ丸</span>
                                    <div class="absolute -top-2 -right-2 bg-amber-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow">${flags.jajamaruFed ? '満足' : 'お腹ぺこ'}</div>
                                </div>
                                <p class="text-xs font-bold text-slate-400 mt-2">肉味噌の妖精</p>
                            </div>
                        </div>

                        <div class="text-center text-[11px] text-slate-500 py-2">
                            ヒント：じゃじゃ丸に特製の辛みダレを食べさせよう
                        </div>
                    </div>
                `;
            } else if(currentArea === 2) {
                // エリア2: ラボ（れいぺん & 謎の装置）
                view.innerHTML = `
                    <div class="flex-1 p-4 flex flex-col justify-between relative bg-gradient-to-b from-slate-900 to-blue-950/30 overflow-y-auto custom-scroll">
                        <div class="text-center py-2">
                            <span class="text-[10px] font-bold tracking-widest text-blue-400 uppercase">AREA 03</span>
                            <h2 class="text-lg font-black text-slate-100">ひえひえラボ</h2>
                        </div>

                        <div class="flex flex-col items-center space-y-6 my-auto py-4">
                            <!-- れいぺん -->
                            <div onclick="interactReipenn()" class="cursor-pointer text-center group">
                                <div class="w-36 h-36 bg-slate-800/90 border-2 border-blue-500/50 rounded-3xl shadow-xl flex flex-col items-center justify-center p-3 relative mx-auto group-hover:border-blue-400 transition">
                                    <div class="text-5xl mb-1">🐧🧊</div>
                                    <span class="text-[11px] font-bold text-blue-300 bg-blue-950/80 px-2 py-0.5 rounded-full border border-blue-800">れいぺん</span>
                                    <div class="absolute -top-2 -right-2 bg-blue-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow">${flags.gotIceKey ? '済' : '鍵'}</div>
                                </div>
                                <p class="text-xs font-bold text-slate-400 mt-2">冷麺ペンギン</p>
                            </div>

                            <!-- ラボの冷凍コントロールパネル -->
                            <div onclick="interactLabPanel()" class="cursor-pointer bg-slate-800/90 border-2 border-slate-700 p-4 rounded-3xl w-full max-w-xs flex items-center justify-between active:scale-95 transition">
                                <div class="flex items-center space-x-3">
                                    <span class="text-3xl">🎛️</span>
                                    <div class="text-left">
                                        <p class="text-xs font-bold text-slate-200">冷却温度調節パネル</p>
                                        <p class="text-[10px] text-slate-400">極冷の温度を入力する装置</p>
                                    </div>
                                </div>
                                <span class="text-xs font-bold px-2.5 py-1 rounded-xl ${flags.labPanelSolved ? 'bg-emerald-600 text-white' : 'bg-slate-700 text-slate-300'}">${flags.labPanelSolved ? '解除済' : 'ロック'}</span>
                            </div>
                        </div>

                        <div class="text-center text-[11px] text-slate-500 py-2">
                            ヒント：れいぺんが求めている冷麺の温度を見つけよう
                        </div>
                    </div>
                `;
            } else if(currentArea === 3) {
                // エリア3: ゴール（最終脱出のとびら）
                view.innerHTML = `
                    <div class="flex-1 p-4 flex flex-col justify-between relative bg-gradient-to-b from-slate-900 to-emerald-950/30 overflow-y-auto custom-scroll">
                        <div class="text-center py-2">
                            <span class="text-[10px] font-bold tracking-widest text-emerald-400 uppercase">AREA 04</span>
                            <h2 class="text-lg font-black text-slate-100">ファイナル出口</h2>
                        </div>

                        <div class="flex flex-col items-center space-y-6 my-auto py-4">
                            <!-- 脱出の扉 -->
                            <div onclick="interactFinalDoor()" class="cursor-pointer text-center group">
                                <div class="w-40 h-48 bg-amber-900/90 border-4 border-amber-700 rounded-3xl shadow-2xl flex flex-col items-center justify-center p-4 relative mx-auto group-hover:border-amber-500 transition">
                                    <div class="text-6xl mb-2">🚪✨</div>
                                    <span class="text-xs font-extrabold text-white bg-amber-950 px-3 py-1 rounded-full border border-amber-800">盛岡駅へと続く扉</span>
                                    <div class="absolute -top-3 -right-3 bg-emerald-600 text-white text-xs font-bold px-2.5 py-1 rounded-full shadow-lg">${flags.doorUnlocked ? 'OPEN' : '要 3つの鍵'}</div>
                                </div>
                                <p class="text-xs font-bold text-slate-400 mt-2">すべての謎を解いて扉を開けよう！</p>
                            </div>
                        </div>

                        <div class="text-center text-[11px] text-slate-500 py-2">
                            ダルマ・じゃじゃ丸・れいぺんから託された手がかりを入力しよう
                        </div>
                    </div>
                `;
            }
        }

        // --- モーダル制御 ---
        function openModal(title, desc, bodyHtml, actionText = null, actionCallback = null) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-desc').textContent = desc;
            document.getElementById('modal-body').innerHTML = bodyHtml;

            const btn = document.getElementById('modal-action-btn');
            if(actionText && actionCallback) {
                btn.textContent = actionText;
                btn.onclick = actionCallback;
                btn.classList.remove('hidden');
            } else {
                btn.classList.add('hidden');
            }

            document.getElementById('modal-overlay').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.add('hidden');
        }

        // --- 各種インタラクションと謎解きロジック ---

        function inspectLobbyNote() {
            openModal(
                "📝 古い石碑のメモ",
                "盛岡の歴史と名所に関するメモ書き。",
                `<div class="bg-slate-800 p-3 rounded-2xl border border-slate-700 text-slate-200 space-y-2 text-xs leading-relaxed">
                    <p><b>【盛岡名所の謎解き記録】</b></p>
                    <p>・盛岡冷麺ダルマの器には、赤いスイカが「1」切れ乗っている。</p>
                    <p>・石割桜は大きな岩を割って力強く咲いている。（数字の「4」のいわれ？）</p>
                    <p>・わんこそばは次々にお椀が重ねられる…</p>
                 </div>`
            );
        }

        function openNoteModal() {
            openModal(
                "📖 ひらめきメモ帳",
                "これまでに集めたヒントのまとめ",
                `<div class="bg-slate-800 p-3 rounded-2xl border border-slate-700 text-slate-200 space-y-2 text-xs leading-relaxed">
                    <p><b>■ ダルマのスイカ数：</b> ${flags.gotWatermelon ? '【 1 】（入手済み）' : '未確認'}</p>
                    <p><b>■ じゃじゃ丸の肉味噌：</b> ${flags.jajamaruFed ? '【 満足済み 】' : '辛みダレを探している'}</p>
